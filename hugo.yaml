        - icon: fab fa-x-twitter
          url: https://twitter.com/prasetiyohadip
        - icon: fa fa-globe
          url: "https://pras.my.id"

  # About
  about:
    enable: true
    title: "About Me"
    image: "/images/me.jpg"
    content: |-
      Strategic Infrastructure Architect with over a decade of experience
      driving the evolution of high-scale platforms. Having grown alongside a
      major Indonesian tech leader from startup phase to public company, I
      specialize in transforming complex, manual legacy environments into
      automated, high-velocity GitOps platforms. I leverage a deep foundation
      in System Engineering and a Master’s in Computational Science to design
      cost-efficient, resilient infrastructures that empower engineering teams
      to deploy faster and with higher confidence. My focus is not just on the
      tools, but on the architectural standards and operational excellence
      required to sustain long-term business growth.

    skills:
      enable: true
      title: "Here are a few technologies I've been working with recently:"
      items:
        - "DevOps"
        - "GitOps"
        - "Kubernetes"
        - "Google Cloud Platform (GCP)"
        - "Terraform"
        - "Linux"

  # Experience
  experience:
    enable: true
    # title: "Custom Name"
    items:
      - company: "Aliz"
        companyUrl: "https://www.aliz.ai"
        jobs:
          - name: "Senior DevOps Engineer"
            date: "Oct 2025 - Dec 2025"
            info:
              content: I worked as senior DevOps engineer to help accelerate and secure the client cloud operation using GCP landing zone and VPC Service Control
            content: |
              🎯 Enterprise Landing Zone Architect: Led the design and delivery
              of a standardized Google Cloud Platform (GCP) Landing Zone,
              migrating a legacy environment to a modular, IaC-driven
              architecture to accelerate deployment speed and operational
              reliability.

              🛜 Network Modernization: Architected and implemented advanced
              cloud networking solutions following GCP best practices,
              optimizing connectivity and performance for client-facing
              applications.

              🚨 Data Security & Governance: Engineered robust security
              perimeters using VPC Service Controls to prevent data
              exfiltration, implementing granular service perimeters that
              restricted access to authorized user groups and applications.

              🔒 Compliance-First Infrastructure: Standardized infrastructure
              security protocols, ensuring client environments met rigorous
              data protection standards through automated governance policies.

            featuredItems:
              fontAwesomeIcons:
                - icon: fa-brands fa-google
                  url: https://cloud.google.com/
                  tooltip: Google Cloud Platform (GCP)
                - icon: fa-brands fa-gitlab
                  url: https://gitlab.com
                  tooltip: Gitlab Platform

      - company: "Bukalapak"
        companyUrl: "https://bukalapak.com"
        jobs:
          - name: "Infrastructure Architect"
            date: "Feb 2022 - Sept 2025"
            # info:
            #   content:
            content: |
              🚀 Strategic Platform Engineering: Spearheaded the design and
              implementation of an enterprise-grade Infrastructure-as-Code
              (IaC) framework to standardize cloud provisioning across the
              organization.

              ⚙️ Operational Excellence & GitOps: Automated complex cloud
              infrastructure workflows using Terraform, ArgoCD, and GitLab CI,
              significantly increasing engineer productivity and deployment
              reliability.

              ✅ Architectural Standardization: Defined and enforced technical
              standards for Kubernetes and Docker environments, ensuring a
              consistent, scalable, and secure platform for microservices.

              🤝 Stakeholder Alignment: Acted as a technical bridge,
              translating business requirements into scalable automation
              strategies based on GitOps principles.

            featuredItems:
              fontAwesomeIcons:
                - icon: fa-brands fa-docker
                  url: https://kubernetes.io
                  tooltip: Kubernetes
                - icon: fa-brands fa-google
                  url: https://cloud.google.com/
                  tooltip: Google Cloud Platform (GCP)
                - icon: fa-brands fa-gitlab
                  url: https://gitlab.com
                  tooltip: Gitlab Platform

          - name: "Senior DevOps Engineer"
            date: "Feb 2020 - Jan 2022"
            # info:
            #   content:
            content: |
              🤖 Continuous Delivery Orchestration: Developed and optimized
              automated deployment pipelines for microservices using GitLab CI
              and Ansible AWX/Tower, targeting hybrid environments including
              on-premise and cloud instance groups.

              🏗️ Infrastructure Modernization: Migrated legacy service
              deployments to Kubernetes clusters, establishing GitOps best
              practices to ensure reproducible and resilient application
              delivery.

              🚀 Scalability & Performance: Orchestrated the lifecycle of
              infrastructure services, ensuring high availability for critical
              application components across diverse cloud platforms.

            featuredItems:
              fontAwesomeIcons:
                - icon: fa-brands fa-docker
                  url: https://kubernetes.io
                  tooltip: Kubernetes
                - icon: fa-brands fa-google
                  url: https://cloud.google.com/
                  tooltip: Google Cloud Platform (GCP)
                - icon: fa-brands fa-gitlab
                  url: https://gitlab.com
                  tooltip: Gitlab Platform

          - name: "Senior System Engineer"
            date: "Feb 2017 - Jan 2020"
            # info:
            #   content:
            content: |
              🏢 Large-Scale Database Management: Engineered and maintained
              highly available data clusters, including Redis, MySQL
              (Multi-master), and Hadoop/HBase to support Bukalapak’s rapid
              growth.

              🏎️ High-Traffic Traffic Management: Deployed and tuned
              high-performance load balancers (Nginx, HAProxy) to manage
              massive user traffic and ensure sub-second latency.

              🛠️ Legacy-to-Modern Transition: Introduced Ansible automation to
              day-to-day data center operations, reducing manual configuration
              errors and standardizing server performance across the fleet.

            featuredItems:
              fontAwesomeIcons:
                - icon: fa-brands fa-linux
                  tooltip: Linux
                - icon: fa-solid fa-server
                  tooltip: On-premise Data Center

